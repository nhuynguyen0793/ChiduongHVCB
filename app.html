<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chỉ đường Học viện</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1d2b26;--mut:#66726d;--line:#d9d6cd;--route:#d6282f;--acc:#0f5c4a;--road:#fff;--roadl:#cfcabd;--map:#e9e6dc;--b1:#cfe3dc;--b2:#f4dfa9;--b3:#c9d3dc;--b4:#cfe6b8;--sel:#0f5c4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--panel:#1b2420;--ink:#e8efeb;--mut:#93a39b;--line:#2d3a34;--map:#17201c;--road:#3a4640;--roadl:#27322d;--b1:#2c4a40;--b2:#5a4b22;--b3:#35424d;--b4:#34502a;--sel:#5fd0ac;--acc:#5fd0ac}}
:root[data-theme="dark"]{--bg:#121815;--panel:#1b2420;--ink:#e8efeb;--mut:#93a39b;--line:#2d3a34;--map:#17201c;--road:#3a4640;--roadl:#27322d;--b1:#2c4a40;--b2:#5a4b22;--b3:#35424d;--b4:#34502a;--sel:#5fd0ac;--acc:#5fd0ac}
*{box-sizing:border-box}html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;}#app{height:100%;display:none;grid-template-columns:340px 1fr;gap:12px;padding:12px}#app.on{display:grid}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
h1{font-size:18px;margin:0;padding:16px 16px 4px}
.from{padding:4px 16px 10px;font-size:13px;color:var(--mut)}
.from select,input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:4px}
.s{padding:0 16px 10px}
#list{overflow:auto;flex:1;padding:0 8px 8px}
#list button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;font:inherit;font-size:15px;background:none;color:var(--ink);border:0;border-radius:10px;padding:11px 10px;cursor:pointer}
#list button:hover,#list button.on{background:var(--bg)}
#list i{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid var(--line)}
#card{border-top:1px solid var(--line);padding:14px 16px;display:none}
#card h2{margin:0 0 4px;font-size:17px}#card p{margin:0 0 10px;color:var(--mut);font-size:14px}
#go{width:100%;font:inherit;font-weight:600;font-size:16px;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:13px;cursor:pointer}
:root[data-theme="dark"] #go{color:#08201a}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #go{color:#08201a}}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--route);outline-offset:2px}
main{background:var(--map);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;min-height:0}
svg{width:100%;height:100%;display:block;touch-action:manipulation}
.pl{stroke:var(--roadl);stroke-width:1;cursor:pointer}.pl.on{stroke:var(--sel);stroke-width:2.5}
.lb{font-size:7px;font-weight:600;fill:var(--ink);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--map);stroke-width:2.2px}
.rn{font-size:6px;fill:var(--mut);text-anchor:middle;font-style:italic}
#rt{fill:none;stroke:var(--route);stroke-width:3;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;animation:d 1s linear infinite}
@keyframes d{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){#rt{animation:none}}
#info{position:absolute;left:12px;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;display:none}
#info b{color:var(--route);font-size:18px}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:auto minmax(320px,1fr)}aside{max-height:50vh}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:8px}.row select{flex:1}#gb{margin-top:4px;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--acc);color:var(--acc);background:none;border-radius:10px;padding:0 12px;cursor:pointer}
#st{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.4}#list em{margin-left:auto;font-style:normal;color:var(--mut);font-size:13px;white-space:nowrap}#list b{font-size:11px;background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;font-weight:600}
#cn2{white-space:pre-line;font-size:13px;color:var(--mut);margin:0 0 10px}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chips button.on{color:#08201a}}:root[data-theme="dark"] .chips button.on{color:#08201a}
#pop{position:absolute;left:12px;bottom:12px;width:min(400px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.2);animation:up .22s ease-out}#pop[hidden]{display:none}
@keyframes up{from{transform:translateY(14px);opacity:0}}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--g) 24%,var(--panel));border-left:6px solid var(--g)}
.ph button,#back{font:inherit;line-height:1;background:none;border:0;color:var(--ink);cursor:pointer}.ph button{margin-left:auto;font-size:22px;padding:2px 6px}
#back{font-size:24px;padding:0 8px 0 0;vertical-align:-2px}
.pb{padding:12px 16px 16px}.pb h2{margin:0 0 8px;font-size:20px}.tg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tg span{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px}.pb p{margin:0 0 10px;font-size:13.5px;color:var(--mut);white-space:pre-line;line-height:1.5}
.chips i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
#intro{height:100%;overflow-y:auto}#intro.off{display:none}
.hero{position:relative;height:min(100vh,780px);min-height:540px;overflow:hidden;background:#0b3d91}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;animation:kb 26s ease-out both}@keyframes kb{from{transform:scale(1.09)}to{transform:scale(1)}}
.hv{position:absolute;left:0;right:0;bottom:0;padding:90px clamp(20px,6vw,80px) calc(34px + env(safe-area-inset-bottom,0px));color:#fff;background:linear-gradient(to top,rgba(6,38,104,.94),rgba(6,38,104,.6) 60%,transparent)}
.hv h1{font-size:clamp(28px,4.6vw,52px);line-height:1.12;margin:0 0 12px;padding:0;max-width:16em}.hv p{margin:0 0 22px;max-width:52ch;font-size:clamp(15px,1.6vw,18px);line-height:1.55}
.ac{display:flex;flex-wrap:wrap;gap:12px}.ac button,.ac a{font:inherit;font-weight:600;font-size:16px;border-radius:99px;padding:13px 24px;cursor:pointer;text-decoration:none}
.pri{background:#d6282f;color:#fff;border:0}.sec{color:#fff;border:2px solid rgba(255,255,255,.8)}
#zones{max-width:1100px;margin:0 auto;padding:40px 20px 64px}#zones h2{font-size:26px;margin:0 0 4px}#zones>p{margin:0 0 22px;color:var(--mut)}
#gc{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.g{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--g);border-radius:12px;padding:16px}.g h3{margin:0 0 4px;font-size:18px}.g h3 button{font:inherit;font-weight:700;background:none;border:0;color:var(--ink);padding:0;cursor:pointer;text-align:left}
.g>p{margin:0 0 12px;color:var(--mut);font-size:13.5px}.pls{display:flex;flex-wrap:wrap;gap:8px}.pls button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:7px}
.pls i{width:10px;height:10px;border-radius:50%}@media (prefers-reduced-motion:reduce){.hero img{animation:none}#pop{animation:none}}
#intro{background:#1064bd}.hero{height:auto;min-height:0;overflow:visible;background:none}
.scr{overflow:visible}.stage{position:relative;aspect-ratio:1672/940;width:min(100vw,calc(100vh*1.7787));width:min(100vw,calc(100dvh*1.7787));container-type:inline-size}#intro{overflow:hidden;display:flex;align-items:center;justify-content:center}.hero{flex:none}@media (max-width:700px){.hero .hv{top:100%;bottom:auto;flex-direction:column;padding:16px 0;text-align:center}.hero .hv h1{font-size:18px;white-space:normal}.hv .pri{font-size:15px;padding:12px 26px}}
.hero .stage>img{position:static;display:block;width:100%;height:100%;object-fit:cover;animation:none}
.hero .hv{position:absolute;left:3.5%;right:3.5%;bottom:2.4%;padding:0;background:none;display:flex;align-items:center;justify-content:space-between;gap:2cqw}
.hero .hv h1{font-size:2.3cqw;margin:0;padding:0;max-width:none;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.pri{font:inherit;font-weight:600;cursor:pointer;border-radius:99px}.hv .pri{padding:.9cqw 2cqw;font-size:max(13px,1.3cqw);white-space:nowrap}
#hp{position:absolute;inset:0}
.mk{position:absolute;width:max(16px,1.8cqw);height:max(16px,1.8cqw);transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;z-index:2}
.mk::before{content:'';position:absolute;inset:23%;border-radius:50%;background:var(--g);border:2.5px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.mk::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid var(--g);opacity:0;animation:ring 3s ease-out infinite;animation-delay:var(--d)}
@keyframes ring{0%{transform:scale(.5);opacity:.9}70%,100%{transform:scale(2.6);opacity:0}}
.mk.on{z-index:4}.mk.on::before{background:#fff;border-color:var(--g);box-shadow:0 0 0 4px var(--g),0 0 22px 9px var(--g);animation:fl .6s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.4)}}.mk:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:50%}
#tip{position:absolute;z-index:6;width:min(290px,70%);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.32);animation:up .2s ease-out}#tip[hidden]{display:none}
#tip h3{margin:0 0 8px;font-size:17px}#tip .pri{width:100%;padding:9px 14px;font-size:14px;border:0;background:#d6282f;color:#fff}
@media (prefers-reduced-motion:reduce){.mk::after,.mk.on::before{animation:none}}
#g_f{position:absolute;right:12px;top:12px;width:min(320px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:3}#g_f.big{width:min(540px,calc(100% - 24px))}
.gh{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:13px;font-weight:600}.gh span:nth-child(2){flex:1}.gh button{font:inherit;font-size:16px;line-height:1;background:none;border:0;color:var(--ink);cursor:pointer;padding:2px 7px}
#g_f.min .gbody{display:none}.gs{display:flex;gap:6px;padding:0 10px 8px}.gs input{margin:0;padding:7px 10px;font-size:13px}.gs button,.gt button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:6px 12px;cursor:pointer}
.gt{display:flex;gap:6px;padding:0 10px 8px}.gt button{flex:1}.gt button.on{background:var(--acc);border-color:var(--acc);color:#fff}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gt button.on{color:#08201a}}:root[data-theme="dark"] .gt button.on{color:#08201a}
#g_i{width:100%;height:220px;border:0;display:block;background:var(--bg)}#g_f.big #g_i{height:360px}
#g_l{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:11.5px;color:var(--mut);line-height:1.35}#g_l a{color:var(--acc);font-weight:600;white-space:nowrap}
@media(max-width:760px){
 #intro{display:block;height:100%;overflow-y:auto;overscroll-behavior:contain}
 .hero{height:auto;min-height:0;overflow:visible}
 .hero .stage{width:100%;height:auto}
 .hero .hv{position:static;display:block;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,#0b3d91,#1064bd)}
 .hero .hv h1{font-size:clamp(22px,6vw,32px);line-height:1.2;white-space:normal}
 .hero .hv p{font-size:15px;margin-bottom:16px}
 #zones{padding:26px 16px 40px}
 #app{height:100%;min-height:0;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,42dvh) minmax(0,1fr);gap:8px;padding:8px}
 aside{max-height:none;min-height:0}
 main{min-height:0}
 #list{min-height:0}
}
@media(max-width:760px) and (max-height:600px){
 #app{grid-template-rows:minmax(0,40dvh) minmax(0,1fr)}
}
</style></head><body>
